name: Dispatch DC-Use Integration

on:
  push:
    branches: [datacosmos]

permissions:
  actions: write

concurrency:
  group: dispatch-dc-use-integration
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch integration workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run integrate-dc-use.yml --ref dc-use --repo "$GITHUB_REPOSITORY"
