name: Integrate DC-Use

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'
  repository_dispatch:
    types: [integrate-dc-use]

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: integrate-dc-use
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dc-use
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dc-use
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'

      - name: Merge upstream main and datacosmos
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main datacosmos --tags
          before="$(git rev-parse HEAD)"
          if ! git merge --no-ff origin/main -m "chore(dc-use): integrate upstream main"; then
            git merge --abort || true
            gh issue create \
              --title "[automation] dc-use integration conflict (main)" \
              --body "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              || true
            exit 1
          fi
          if ! git merge --no-ff origin/datacosmos -m "chore(dc-use): integrate datacosmos"; then
            git merge --abort || true
            gh issue create \
              --title "[automation] dc-use integration conflict (datacosmos)" \
              --body "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              || true
            exit 1
          fi
          after="$(git rev-parse HEAD)"
          if [[ "$before" == "$after" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[i] dc-use already integrates main and datacosmos"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.merge.outputs.changed == 'true'
        run: bash scripts/ensure-deps.sh

      - name: Build and validate
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -euo pipefail
          bun run build:all
          bun run validate
          bun run validate:ci-parity
          (cd ui && bun run validate)

      - name: Push dc-use
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:dc-use

      - name: Dispatch dc release
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-dc-use.yml --ref dc-use

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "[automation] dc-use integration failed" \
            --body "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            || true
