name: Label Pending Release

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
    branches: [main]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read

    steps:
      # This job reconciles GitHub Issue labels. A fork that tracks work in an
      # external tracker keeps Issues disabled, and every `gh label`/`gh issue`
      # call then fails with "repository has disabled issues" — under
      # `set -euo pipefail` the first one aborts the job, so the check goes red
      # on every pull request rather than on a real problem.
      #
      # Skip explicitly instead of masking: if Issues are ever enabled, the
      # guard stops matching and the reconciliation runs again unchanged.
      - name: Skip when the repository has Issues disabled
        id: issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ENABLED=$(gh repo view "${{ github.repository }}" --json hasIssuesEnabled --jq '.hasIssuesEnabled')
          echo "enabled=${ENABLED}" >> "$GITHUB_OUTPUT"

          if [[ "$ENABLED" != "true" ]]; then
            echo "Issues are disabled on ${{ github.repository }}; nothing to reconcile."
          fi

      - name: Reconcile pending-release labels for open main PRs
        if: steps.issues.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Recompute the complete open-PR issue set so edited/synchronized PRs
          # can remove stale pending-release labels as well as add new ones.
          OPEN_PRS=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base main \
            --state open \
            --json number,title,body \
            --jq '.[] | @base64')

          ALL_REFERENCED_ISSUES=""
          while IFS= read -r PR_ROW; do
            [[ -z "$PR_ROW" ]] && continue
            PR_JSON=$(printf '%s' "$PR_ROW" | base64 --decode)
            PR_NUM=$(printf '%s' "$PR_JSON" | jq -r '.number')
            PR_TITLE=$(printf '%s' "$PR_JSON" | jq -r '.title')
            PR_BODY=$(printf '%s' "$PR_JSON" | jq -r '.body // ""')
            COMMIT_TEXT=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUM}/commits" --paginate --jq '.[].commit.message')
            PR_TEXT="$PR_TITLE
            $PR_BODY
            $COMMIT_TEXT"
            PR_ISSUES=$(printf '%s\n' "$PR_TEXT" | \
              perl -ne 'while (/\b(?:fixes|closes|resolves|refs?)\s+((?:#[0-9]+\b(?:\s*+(?:,|and)?\s*+#[0-9]+\b)*))/ig) { $issues = $1; while ($issues =~ /(#[0-9]+)/g) { print "$1\n"; } }')
            if [[ -n "$PR_ISSUES" ]]; then
              ALL_REFERENCED_ISSUES=$(printf '%s\n%s\n' "$ALL_REFERENCED_ISSUES" "$PR_ISSUES")
            fi
          done <<< "$OPEN_PRS"

          ISSUES=$(printf '%s\n' "$ALL_REFERENCED_ISSUES" | sed -nE '/^#[0-9]+$/p' | sort -u)
          CURRENT_PENDING=$(gh issue list --repo "${{ github.repository }}" --label "pending-release" --state all --json number --jq '.[].number')

          gh label create "pending-release" \
            --color "fbca04" \
            --description "Fix in review, awaiting merge" \
            --force \
            --repo "${{ github.repository }}"

          if [[ -z "$ISSUES" ]]; then
            echo "No linked issues found across open main PRs"
          else
            for ISSUE in $ISSUES; do
              NUM=${ISSUE#\#}
              echo "Ensuring issue #$NUM has pending-release"
              gh issue edit "$NUM" --add-label "pending-release" --repo "${{ github.repository }}"
            done
          fi

          for NUM in $CURRENT_PENDING; do
            if ! printf '%s\n' "$ISSUES" | grep -qx "#${NUM}"; then
              echo "Removing stale pending-release from issue #$NUM"
              gh issue edit "$NUM" --remove-label "pending-release" --repo "${{ github.repository }}"
            fi
          done
