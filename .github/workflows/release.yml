name: Package GitHub Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-release tag to package, for example v8.9.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-release-assets-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    # One job per platform. The tarball ships node_modules so a consumer needs
    # no network and no compiler at install time, and optional dependencies are
    # platform-resolved: chokidar pulls fsevents on macOS only, so a bundle
    # built on Linux would silently downgrade macOS file watching to polling
    # (src/web-server/file-watcher.ts, src/cliproxy/sync/auto-sync-watcher.ts).
    # Each runner therefore resolves its own tree. bcrypt needs no per-platform
    # build: it ships prebuilds for all seven targets and selects at runtime.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux_amd64
          - runner: ubuntu-24.04-arm
            platform: linux_arm64
          - runner: macos-13
            platform: darwin_amd64
          - runner: macos-latest
            platform: darwin_arm64
          - runner: windows-latest
            platform: windows_amd64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install dependencies
        run: bash scripts/ensure-deps.sh

      - name: Build package
        run: bun run build:all

      - name: Validate
        run: bun run validate

      - name: Verify tag, package, and release provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "[X] Expected a semantic version tag, got: $TAG"
            exit 1
          fi

          tag_commit="$(git rev-parse "${TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "[X] Checkout $head_commit does not match tag $TAG at $tag_commit"
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "[X] Tag $TAG does not identify a commit on origin/main"
            exit 1
          fi

          version="${TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "$version" ]]; then
            echo "[X] Tag version $version does not match package.json $package_version"
            exit 1
          fi

          release_json=""
          for attempt in {1..12}; do
            if release_json="$(gh release view "$TAG" --json tagName,isDraft,targetCommitish 2>/dev/null)"; then
              break
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "[X] Semantic-release GitHub release $TAG does not exist"
              exit 1
            fi
            sleep 10
          done

          release_tag="$(jq -r '.tagName' <<<"$release_json")"
          release_draft="$(jq -r '.isDraft' <<<"$release_json")"
          release_target="$(jq -r '.targetCommitish' <<<"$release_json")"
          if [[ "$release_tag" != "$TAG" || "$release_draft" != "false" ]]; then
            echo "[X] Release must be published and identify tag $TAG"
            exit 1
          fi
          if [[ "$release_target" != "main" && "$release_target" != "$TAG" && "$release_target" != "$tag_commit" && "$tag_commit" != "$release_target"* ]]; then
            echo "[X] Release target $release_target does not identify main or $tag_commit"
            exit 1
          fi

          {
            echo "TAG=$TAG"
            echo "VERSION=$version"
            echo "ASSET=ccs_${version}_${PLATFORM}_package.tar.gz"
            echo "CHECKSUMS=ccs_${version}_${PLATFORM}_checksums.txt"
          } >> "$GITHUB_ENV"

      - name: Install production dependencies for this platform
        run: |
          set -euo pipefail
          # Discard the dev tree used for build/validate and resolve runtime
          # dependencies only, on this runner, so optionalDependencies match the
          # target platform. --ignore-scripts is safe here: preinstall.js exits
          # early under CI, and bcrypt resolves its prebuild at runtime through
          # node-gyp-build rather than during install.
          rm -rf node_modules
          npm install --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Pack release assets
        run: |
          set -euo pipefail
          # node_modules is part of the artifact: the consumer installs by
          # unpacking, with no registry access and no build toolchain.
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$ASSET" \
            package.json \
            README.md \
            LICENSE \
            dist \
            lib \
            scripts \
            config \
            node_modules
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "$CHECKSUMS"
          else
            shasum -a 256 "$ASSET" > "$CHECKSUMS"
          fi

      - name: Upload assets to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for asset in "$ASSET" "$CHECKSUMS"; do
            if grep -Fxq "$asset" <<<"$existing_assets"; then
              echo "[X] Release asset already exists and will not be overwritten: $asset"
              exit 1
            fi
          done
          gh release upload "$TAG" "$ASSET" "$CHECKSUMS"
