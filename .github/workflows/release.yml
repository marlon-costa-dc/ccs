name: Package GitHub Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-release tag to package, for example v8.9.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-release-assets-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install dependencies
        run: bash scripts/ensure-deps.sh

      - name: Build package
        run: bun run build:all

      - name: Validate
        run: bun run validate

      - name: Verify tag, package, and release provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "[X] Expected a semantic version tag, got: $TAG"
            exit 1
          fi

          tag_commit="$(git rev-parse "${TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "[X] Checkout $head_commit does not match tag $TAG at $tag_commit"
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "[X] Tag $TAG does not identify a commit on origin/main"
            exit 1
          fi

          version="${TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "$version" ]]; then
            echo "[X] Tag version $version does not match package.json $package_version"
            exit 1
          fi

          release_json=""
          for attempt in {1..12}; do
            if release_json="$(gh release view "$TAG" --json tagName,isDraft,targetCommitish 2>/dev/null)"; then
              break
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "[X] Semantic-release GitHub release $TAG does not exist"
              exit 1
            fi
            sleep 10
          done

          release_tag="$(jq -r '.tagName' <<<"$release_json")"
          release_draft="$(jq -r '.isDraft' <<<"$release_json")"
          release_target="$(jq -r '.targetCommitish' <<<"$release_json")"
          if [[ "$release_tag" != "$TAG" || "$release_draft" != "false" ]]; then
            echo "[X] Release must be published and identify tag $TAG"
            exit 1
          fi
          if [[ "$release_target" != "main" && "$release_target" != "$TAG" && "$release_target" != "$tag_commit" && "$tag_commit" != "$release_target"* ]]; then
            echo "[X] Release target $release_target does not identify main or $tag_commit"
            exit 1
          fi

          {
            echo "TAG=$TAG"
            echo "VERSION=$version"
            echo "ASSET=ccs_${version}_package.tar.gz"
            echo "CHECKSUMS=ccs_${version}_checksums.txt"
          } >> "$GITHUB_ENV"

      - name: Install production dependencies for the bundle
        run: |
          set -euo pipefail
          # The tarball has to carry its own runtime dependencies. Without them
          # the installed CLI resolves modules from whatever happens to sit in
          # the user's home: express@4 calls mime.lookup(), does not declare
          # mime itself, and picked up a hoisted mime@4 where .lookup no longer
          # exists -- so `ccs config` died with "mime.lookup is not a function"
          # and the dashboard never served a request.
          #
          # Bundling alone is not enough. express@4 reaches mime through
          # hoisting it never declares: a clean install nests mime@1.6.0 under
          # send/, where express cannot see it. The overrides block in
          # package.json pins mime@1 at the top level so express resolves the
          # API it actually calls.
          rm -rf node_modules
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          test -d node_modules/express || { echo "[X] express missing from bundle"; exit 1; }
          node -e "
            const m = require('module');
            const ep = require.resolve('express', { paths: [process.cwd()] });
            const req = m.createRequire(ep);
            const version = req('mime/package.json').version;
            const lookup = typeof req('mime').lookup;
            console.log('bundled mime for express: ' + version + ' lookup=' + lookup);
            if (lookup !== 'function') {
              console.error('[X] bundled express cannot resolve a mime exposing .lookup');
              process.exit(1);
            }
          "

      - name: Pack release assets
        run: |
          set -euo pipefail
          bash scripts/build-release-asset.sh
          sha256sum "$ASSET" > "$CHECKSUMS"

      - name: Upload assets to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for asset in "$ASSET" "$CHECKSUMS"; do
            if grep -Fxq "$asset" <<<"$existing_assets"; then
              echo "[X] Release asset already exists and will not be overwritten: $asset"
              exit 1
            fi
          done
          gh release upload "$TAG" "$ASSET" "$CHECKSUMS"
