name: GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package, for example v8.9.0-dc3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install dependencies
        run: bash scripts/ensure-deps.sh

      - name: Build package
        run: bun run build:all

      - name: Validate
        run: bun run validate

      - name: Pack release asset
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          ASSET="ccs_${VERSION}_package.tar.gz"
          tar -czf "${ASSET}" \
            package.json \
            README.md \
            LICENSE \
            dist \
            lib \
            scripts \
            config
          sha256sum "${ASSET}" > checksums.txt
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSET}" checksums.txt --clobber
          else
            gh release create "${TAG}" "${ASSET}" checksums.txt \
              --title "CCS ${VERSION}" \
              --generate-notes
          fi
