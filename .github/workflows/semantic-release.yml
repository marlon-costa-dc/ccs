name: Semantic Release

# Sole owner of CCS package versions, changelog entries, npm publication,
# package tags, and package GitHub releases.

on:
  push:
    branches: [main]

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64]
    outputs:
      should_release: ${{ steps.release-guard.outputs.should_release }}

    steps:
      - name: Check release recursion guard
        id: release-guard
        shell: bash
        run: |
          SHOULD_RELEASE=true
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            HEAD_SUBJECT=$(jq -r '.head_commit.message // "" | split("\n")[0]' "$GITHUB_EVENT_PATH")
            case "$HEAD_SUBJECT" in
              "chore(release): "*)
                SHOULD_RELEASE=false
                echo "Skipping generated release commit: $HEAD_SUBJECT"
                ;;
            esac
          fi
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

  release:
    needs: guard
    if: ${{ needs.guard.outputs.should_release == 'true' }}
    runs-on: [self-hosted, linux, x64]

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bash scripts/ensure-deps.sh

      - name: Build
        run: bun run build:all

      - name: Validate fast gate
        run: bun run validate

      - name: Semantic Release
        env:
          HUSKY: 0
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          auth_header=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${auth_header}"
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=http.https://github.com/kaitranntt/ccs.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          export GIT_CONFIG_KEY_1=http.https://github.com/kaitranntt/ccs.git.extraheader
          export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic ${auth_header}"

          npx semantic-release
