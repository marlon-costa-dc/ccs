name: Semantic Release

# Sole owner of CCS package versions, changelog entries, tags, and GitHub
# releases. This fork does not publish to npm.

on:
  push:
    branches: [main]
  # Manual trigger for recovery: when a run is cancelled or never starts (for
  # example a queue stuck on an unavailable runner), the only way back was an
  # empty commit on main. semantic-release is idempotent — it exits without
  # publishing when no releasable commit exists since the last tag — so an
  # operator-initiated run is safe.
  workflow_dispatch:

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    if: ${{ github.ref == 'refs/heads/main' }}
    # GitHub-hosted, like every other active workflow. This fork registers no
    # self-hosted runners (`/actions/runners` returns zero), so jobs pinned to
    # that label never start: releases sat pending or were cancelled, and a
    # merged change could not reach a published artifact. The job needs no
    # machine-local state — it checks out, builds and calls semantic-release.
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release-guard.outputs.should_release }}

    steps:
      - name: Check release recursion guard
        id: release-guard
        shell: bash
        run: |
          SHOULD_RELEASE=true
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            HEAD_SUBJECT=$(jq -r '.head_commit.message // "" | split("\n")[0]' "$GITHUB_EVENT_PATH")
            case "$HEAD_SUBJECT" in
              "chore(release): "*)
                SHOULD_RELEASE=false
                echo "Skipping generated release commit: $HEAD_SUBJECT"
                ;;
            esac
          fi
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

  release:
    needs: guard
    if: ${{ needs.guard.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bash scripts/ensure-deps.sh

      - name: Build
        run: bun run build:all

      - name: Validate fast gate
        run: bun run validate

      - name: Semantic Release
        env:
          HUSKY: 0
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: npx semantic-release
